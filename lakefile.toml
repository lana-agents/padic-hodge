name = "padic-hodge"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PadicHodge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Same Mathlib pin as `iut` (v4.32.0 = 81a5d25).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "PadicHodge"
