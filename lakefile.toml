name = "padic-hodge"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PadicHodge"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Same Mathlib pin as `iut` (v4.32.0 = 81a5d25).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "PadicHodge"

# The p-adic logarithm (`PadicLogVolume.padicLog`), reused for the logarithm of the
# cyclotomic character (`H¹(Γ, \hat{ℚ_p(μ_{p^∞})}) ≅ ℚ_p`). Same pin as `iut`.
[[require]]
name = "padic-log-volume"
git = "https://github.com/lana-agents/padic-log-volume"
rev = "9a190da26368465ccf92561bc283fe710ae730f0"
