# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for this formalization,
# following https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "padic-hodge"
  description: >-
    Lean 4 / Mathlib formalization of p-adic Hodge theory as needed for Mochizuki's relative
    p-adic Grothendieck conjecture: the Galois action on C_p, Ax-Sen-Tate, Tate's Galois
    cohomology of C_p(j), Hodge-Tate representations, p-divisible groups.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "CMI summer school notes on p-adic Hodge theory"
    authors: ["Olivier Brinon", "Brian Conrad"]
    type: "lecture-notes"
    location: "Sections 2, 5, 14"
    note: "Main reference (references/README.md)."

classification:
  arxiv: ["math.NT"]
  msc2020: ["11S20", "14F30"]

status:
  scope: "Galois action on C_p; Ax's lemma; Ax-Sen-Tate; H^0(G_L, C_p) = L; Tate: H^0(G_L, C_p(j)) = 0 for j != 0; Hodge-Tate representations (Serre-Tate lemma, decomposition, sub/quotient stability)"
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "PadicHodge.galCp, PadicHodge.norm_galCp: G_L acts on C_p by isometric continuous ring automorphisms"
    - "PadicHodge.ax: Ax's lemma with constant p^(p/(p-1)^2)"
    - "PadicHodge.galCp_eq_self_iff_mem_closure, PadicHodge.galCp_eq_self_iff_mem: Ax-Sen-Tate, C_p^(G_L) = closure of L (= L for L/Q_p finite)"
    - "PadicHodge.H0CpIso: H^0_cont(G_L, C_p) = L for L/Q_p finite"
    - "PadicHodge.finrank_adjoin_primitiveRoot: [Q_p(zeta_{p^n}) : Q_p] = phi(p^n)"
    - "PadicHodge.eq_zero_of_autCp_eq_smul: Tate's normalised-trace argument (no eigenvectors near 1 in the completion of Q_p(mu_{p^infty}))"
    - "PadicHodge.cpTwistRep_invariants_eq_bot, PadicHodge.H0CpTwistIso: Tate, C_p(j)^(G_L) = 0 and H^0_cont(G_L, C_p(j)) = 0 for j != 0"
    - "PadicHodge.SerreTate.linearIndependent_of_eigen, PadicHodge.sum_finrank_DHT_le: Serre-Tate lemma"
    - "PadicHodge.IsHodgeTate, PadicHodge.isHodgeTate_iff_exists_basis: Hodge-Tate representations and the Hodge-Tate decomposition"
    - "PadicHodge.isHodgeTate_of_exact: sub- and quotient representations of Hodge-Tate representations are Hodge-Tate"
    - "PadicHodge.eq_zero_of_twist_equivariant: Hom_G(C_p(a), C_p(b)) = 0 for a != b"
    - "PadicHodge.isHodgeTate_dual, PadicHodge.isHodgeTate_tprod, PadicHodge.htWeights: duals, tensor products, Hodge-Tate weights"
    - "PadicHodge.ContH1.H1, PadicHodge.ContH1.inf_injective, PadicHodge.ContH1.exists_inf_of_res_eq_zero: continuous H^1 and inflation-restriction"
    - "PadicHodge.subsingleton_H1_quotient_twist: H^1(Gal(Q_p(mu_p^inf)/Q_p), completion of Q_p(mu_p^inf)(j)) = 0 for j != 0"

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.

acknowledgements: "Built on Mathlib (Apache-2.0)."
